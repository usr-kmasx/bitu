[package]
name = "bitu-gui"
version = "1.0.0"
edition = "2021"
description = "Bitu GUI: live frame-time telemetry and attach/detach for the limiter (en-US)."
repository = "https://github.com/usr-kmasx/bitu"

[[bin]]
name = "bitu"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
libc = "0.2"
